<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1500" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4b47"/>
      <stop offset="100%" stop-color="#153a37"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="135%">
      <stop offset="0%" stop-color="#1e4b47"/>
      <stop offset="55%" stop-color="#2f6a63"/>
      <stop offset="100%" stop-color="#9e4423"/>
    </linearGradient>
    <linearGradient id="photo1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f7d72"/>
      <stop offset="100%" stop-color="#1f4d46"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#0a0806" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1500" fill="#fbf7f1"/>

  <!-- ══ Header / Toolbar ══ -->
  <rect width="1100" height="56" fill="#1a1a2e"/>
  <text x="24" y="36" fill="white" font-size="18" font-weight="700">✈ TravelSphere</text>
  <rect x="180" y="18" rx="18" ry="18" width="64" height="22" fill="rgba(255,255,255,0.15)"/>
  <text x="198" y="33" fill="white" font-size="11" font-weight="600">Flights</text>
  <rect x="250" y="18" rx="18" ry="18" width="62" height="22" fill="rgba(255,255,255,0.1)"/>
  <text x="266" y="33" fill="rgba(255,255,255,0.8)" font-size="11" font-weight="500">Hotels</text>
  <rect x="318" y="18" rx="18" ry="18" width="52" height="22" fill="rgba(255,255,255,0.1)"/>
  <text x="332" y="33" fill="rgba(255,255,255,0.8)" font-size="11" font-weight="500">Cars</text>
  <rect x="376" y="18" rx="18" ry="18" width="72" height="22" fill="rgba(255,255,255,0.1)"/>
  <text x="394" y="33" fill="rgba(255,255,255,0.8)" font-size="11" font-weight="500">Packages</text>
  <rect x="454" y="18" rx="18" ry="18" width="72" height="22" fill="rgba(255,255,255,0.1)"/>
  <text x="472" y="33" fill="rgba(255,255,255,0.8)" font-size="11" font-weight="500">Insurance</text>
  <rect x="532" y="18" rx="18" ry="18" width="66" height="22" fill="rgba(255,255,255,0.1)"/>
  <text x="548" y="33" fill="rgba(255,255,255,0.8)" font-size="11" font-weight="500">AI Travel</text>

  <circle cx="1020" cy="28" r="14" fill="rgba(255,255,255,0.1)"/>
  <text x="1020" y="33" fill="white" font-size="12" text-anchor="middle">🔍</text>
  <rect x="1044" y="16" rx="16" ry="16" width="56" height="24" stroke="rgba(255,255,255,0.5)" stroke-width="1" fill="none"/>
  <text x="1072" y="32" fill="white" font-size="11" text-anchor="middle" font-weight="500">Sign In</text>

  <!-- ══ Hero — full-bleed photography with slideshow ══ -->
  <rect y="56" width="1100" height="470" fill="url(#heroGrad)"/>

  <!-- Slide image blocks (representing the rotating destination photos) -->
  <rect y="56" width="1100" height="470" fill="url(#photo1)" opacity="0.55"/>
  <ellipse cx="860" cy="300" rx="330" ry="180" fill="#2f6a63" opacity="0.5"/>
  <ellipse cx="180" cy="420" rx="260" ry="120" fill="#1f4d46" opacity="0.6"/>
  <!-- dark scrim -->
  <rect y="56" width="1100" height="470" fill="url(#heroGrad)" opacity="0.55"/>

  <!-- Eyebrow badge -->
  <rect x="410" y="100" rx="999" ry="999" width="280" height="26" fill="rgba(20,32,30,0.45)" stroke="rgba(255,249,240,0.3)" stroke-width="1"/>
  <circle cx="432" cy="113" r="4" fill="#e9b44c"/>
  <text x="444" y="117" fill="rgba(255,249,240,0.9)" font-size="10" font-weight="600" letter-spacing="2">AI TRAVEL AGENT · DOOR-TO-DOOR</text>

  <text x="550" y="168" fill="#fff9f0" font-size="40" font-weight="500" text-anchor="middle" font-family="'Fraunces',Georgia,serif">Your whole trip.</text>
  <text x="550" y="216" fill="#fff9f0" font-size="40" font-weight="500" text-anchor="middle" font-family="'Fraunces',Georgia,serif"><tspan font-style="italic" fill="#f0b46e">One conversation.</tspan></text>
  <text x="550" y="252" fill="rgba(255,249,240,0.92)" font-size="13" text-anchor="middle">From your doorstep to the destination and back home again — flights, stays, local rides,</text>
  <text x="550" y="270" fill="rgba(255,249,240,0.92)" font-size="13" text-anchor="middle">activities and insurance. TravelSphere plans it, books it, and puts it on your calendar.</text>

  <!-- Floating chat-first card -->
  <rect x="220" y="292" rx="26" ry="26" width="660" height="196" fill="rgba(251,247,241,0.97)" filter="url(#shadow2)"/>
  <!-- card head -->
  <rect x="248" y="312" rx="14" ry="14" width="42" height="42" fill="#ecdcc2" stroke="rgba(122,84,44,0.25)" stroke-width="1"/>
  <text x="269" y="340" font-size="20" text-anchor="middle">🤖</text>
  <text x="304" y="332" font-size="14" font-weight="600" fill="#1e4b47" font-family="'Fraunces',Georgia,serif">Plan with the TravelSphere AI</text>
  <text x="304" y="350" font-size="10" fill="#7a6e63">Destination · days · budget — in one sentence</text>

  <!-- input row -->
  <rect x="248" y="368" rx="16" ry="16" width="560" height="48" fill="#ffffff" stroke="#e5d9c7" stroke-width="1"/>
  <text x="266" y="397" font-size="13" fill="#c05b33">💬</text>
  <text x="290" y="397" font-size="12" fill="#a79a8c">Try "Goa, 5 days, ₹40,000, by train"</text>
  <rect x="680" y="374" rx="12" ry="12" width="120" height="36" fill="#1e4b47"/>
  <text x="740" y="396" fill="#fdf9f2" font-size="12" text-anchor="middle" font-weight="600">Plan with AI →</text>

  <!-- quick chips -->
  <rect x="248" y="430" rx="999" ry="999" width="140" height="28" fill="#f4ebde" stroke="#e0d2bc" stroke-width="1"/>
  <text x="318" y="448" fill="#5c5046" font-size="10" text-anchor="middle" font-weight="500">Goa · 5 days · ₹40,000</text>
  <rect x="398" y="430" rx="999" ry="999" width="150" height="28" fill="#f4ebde" stroke="#e0d2bc" stroke-width="1"/>
  <text x="473" y="448" fill="#5c5046" font-size="10" text-anchor="middle" font-weight="500">Kerala · 7 days · ₹60,000</text>
  <rect x="558" y="430" rx="999" ry="999" width="150" height="28" fill="#f4ebde" stroke="#e0d2bc" stroke-width="1"/>
  <text x="633" y="448" fill="#5c5046" font-size="10" text-anchor="middle" font-weight="500">Manali · 4 days · ₹35,000</text>

  <!-- slide caption tag -->
  <rect x="952" y="490" rx="999" ry="999" width="120" height="24" fill="rgba(15,25,23,0.5)"/>
  <text x="1012" y="506" fill="rgba(255,249,240,0.86)" font-size="9" text-anchor="middle" letter-spacing="1">GOA · BEACHES &amp; SUNSETS</text>

  <!-- ══ Trust / scale bar ══ -->
  <rect y="526" width="1100" height="44" fill="#fbf7f1"/>
  <line x1="0" y1="526" x2="1100" y2="526" stroke="#ede0ce" stroke-width="1"/>
  <text x="350" y="554" font-size="12" fill="#7a6e63"><tspan fill="#1e4b47" font-weight="700">10</tspan> destinations<tspan fill="#d9c8ae"> · </tspan><tspan fill="#1e4b47" font-weight="700">18</tspan> microservices<tspan fill="#d9c8ae"> · </tspan><tspan fill="#1e4b47" font-weight="700">500+</tspan> airlines<tspan fill="#d9c8ae"> · </tspan><tspan fill="#1e4b47" font-weight="700">24×7</tspan> AI support</text>

  <!-- ══ Book your trip section ══ -->
  <text x="550" y="616" fill="#c05b33" font-size="10" text-anchor="middle" font-weight="600" letter-spacing="3">BOOK YOUR TRIP</text>
  <text x="550" y="646" font-size="26" font-weight="600" fill="#2b2420" text-anchor="middle" font-family="'Fraunces',Georgia,serif">Everything a journey needs</text>
  <text x="550" y="668" fill="#7a6e63" font-size="12" text-anchor="middle">Flights, stays, rides, insurance and packages — or let the AI put it all together.</text>

  <!-- Service Cards (3x2 grid) -->
  <!-- Flight -->
  <rect x="40" y="690" rx="16" ry="16" width="320" height="110" fill="#fffdf9" filter="url(#shadow1)"/>
  <text x="60" y="724" font-size="26">✈</text>
  <text x="100" y="720" font-size="15" font-weight="600" fill="#2b2420">Flights</text>
  <text x="100" y="738" font-size="11" fill="#7a6e63">Search &amp; Book</text>
  <text x="60" y="762" font-size="11" fill="#8a7f74">Find the best flight deals across</text>
  <text x="60" y="778" font-size="11" fill="#8a7f74">500+ airlines worldwide.</text>

  <!-- Hotels -->
  <rect x="390" y="690" rx="16" ry="16" width="320" height="110" fill="#fffdf9" filter="url(#shadow1)"/>
  <text x="410" y="724" font-size="26">🏨</text>
  <text x="450" y="720" font-size="15" font-weight="600" fill="#2b2420">Hotels</text>
  <text x="450" y="738" font-size="11" fill="#7a6e63">Stay Anywhere</text>
  <text x="410" y="762" font-size="11" fill="#8a7f74">Book hotels, resorts, and homestays</text>
  <text x="410" y="778" font-size="11" fill="#8a7f74">at the best prices.</text>

  <!-- Car Rental -->
  <rect x="740" y="690" rx="16" ry="16" width="320" height="110" fill="#fffdf9" filter="url(#shadow1)"/>
  <text x="760" y="724" font-size="26">🚗</text>
  <text x="800" y="720" font-size="15" font-weight="600" fill="#2b2420">Car Rental</text>
  <text x="800" y="738" font-size="11" fill="#7a6e63">Drive Free</text>
  <text x="760" y="762" font-size="11" fill="#8a7f74">Ride in style with our premium</text>
  <text x="760" y="778" font-size="11" fill="#8a7f74">car rental services.</text>

  <!-- Transport -->
  <rect x="40" y="818" rx="16" ry="16" width="320" height="110" fill="#fffdf9" filter="url(#shadow1)"/>
  <text x="60" y="852" font-size="26">🚆</text>
  <text x="100" y="848" font-size="15" font-weight="600" fill="#2b2420">Transport</text>
  <text x="100" y="866" font-size="11" fill="#7a6e63">Bus &amp; Train</text>
  <text x="60" y="890" font-size="11" fill="#8a7f74">Book bus and train tickets for</text>
  <text x="60" y="906" font-size="11" fill="#8a7f74">intercity travel.</text>

  <!-- Insurance -->
  <rect x="390" y="818" rx="16" ry="16" width="320" height="110" fill="#fffdf9" filter="url(#shadow1)"/>
  <text x="410" y="852" font-size="26">☂</text>
  <text x="450" y="848" font-size="15" font-weight="600" fill="#2b2420">Insurance</text>
  <text x="450" y="866" font-size="11" fill="#7a6e63">Travel Safe</text>
  <text x="410" y="890" font-size="11" fill="#8a7f74">Protect your trip with comprehensive</text>
  <text x="410" y="906" font-size="11" fill="#8a7f74">travel insurance.</text>

  <!-- Packages -->
  <rect x="740" y="818" rx="16" ry="16" width="320" height="110" fill="#fffdf9" filter="url(#shadow1)"/>
  <text x="760" y="852" font-size="26">🎁</text>
  <text x="800" y="848" font-size="15" font-weight="600" fill="#2b2420">Packages</text>
  <text x="800" y="866" font-size="11" fill="#7a6e63">Holiday Deals</text>
  <text x="760" y="890" font-size="11" fill="#8a7f74">All-in-one holiday packages at</text>
  <text x="760" y="906" font-size="11" fill="#8a7f74">unbeatable prices.</text>

  <!-- ══ Demo video section ══ -->
  <text x="550" y="1010" fill="#c05b33" font-size="10" text-anchor="middle" font-weight="600" letter-spacing="3">WATCH IT IN ACTION</text>
  <text x="550" y="1040" font-size="24" font-weight="600" fill="#2b2420" text-anchor="middle" font-family="'Fraunces',Georgia,serif">Plan a full week in Goa — <tspan font-style="italic" fill="#c05b33">door to door</tspan></text>
  <text x="550" y="1062" fill="#7a6e63" font-size="12" text-anchor="middle">Watch TravelSphere plan a full week in Goa, door to door, in under 2 minutes.</text>

  <!-- video thumbnail -->
  <rect x="70" y="1084" rx="26" ry="26" width="960" height="180" fill="#17130f" filter="url(#shadow2)"/>
  <rect x="70" y="1084" rx="26" ry="26" width="960" height="180" fill="#2f6a63" opacity="0.45"/>
  <ellipse cx="880" cy="1190" rx="220" ry="90" fill="#1e4b47" opacity="0.5"/>
  <!-- play button -->
  <circle cx="550" cy="1174" r="40" fill="rgba(251,247,241,0.95)"/>
  <circle cx="550" cy="1174" r="54" fill="none" stroke="rgba(251,247,241,0.55)" stroke-width="2"/>
  <text x="550" y="1184" fill="#1e4b47" font-size="26" text-anchor="middle">▶</text>
  <rect x="922" y="1216" rx="999" ry="999" width="92" height="24" fill="rgba(15,25,23,0.55)"/>
  <text x="968" y="1232" fill="rgba(255,249,240,0.92)" font-size="9" text-anchor="middle" letter-spacing="1">≈ 2 MIN</text>

  <!-- ══ AI CTA card ══ -->
  <rect x="40" y="1300" rx="24" ry="24" width="1020" height="140" fill="url(#aiGrad)"/>
  <text x="80" y="1346" fill="white" font-size="22" font-weight="600" font-family="'Fraunces',Georgia,serif">Meet the TravelSphere AI</text>
  <text x="80" y="1372" fill="rgba(255,255,255,0.92)" font-size="12">One conversation plans the whole journey — transport, stay, food, activities and the way home.</text>
  <text x="80" y="1390" fill="rgba(255,255,255,0.92)" font-size="12">Ask for changes, it re-plans live.</text>
  <rect x="80" y="1408" rx="20" ry="20" width="130" height="34" fill="#f0b46e"/>
  <text x="145" y="1430" fill="#2b2420" font-size="12" text-anchor="middle" font-weight="600">💬 Chat with AI</text>
  <rect x="222" y="1408" rx="20" ry="20" width="130" height="34" fill="#ffffff"/>
  <text x="287" y="1430" fill="#1e4b47" font-size="12" text-anchor="middle" font-weight="600">✏ Plan a Trip</text>
  <text x="940" y="1410" font-size="80" text-anchor="middle">🧭</text>
</svg>
