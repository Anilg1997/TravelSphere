# =============================================================================
# TravelSphere Platform — CI Pipeline
# =============================================================================
# Runs on every push and PR to main.
# Executes backend unit tests for all services and frontend build.
# Generates dynamic shields.io badges for README.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ─────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - food-delivery-service
          - flight-service
          - hotel-service
          - notification-service
          - admin-service
          - payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests for ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw test -B --fail-at-end
          else
            mvn test -B --fail-at-end
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  # ── Frontend Build ────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/travelsphere-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/travelsphere-ui
        run: npm ci

      - name: Build Angular app
        working-directory: frontend/travelsphere-ui
        run: npx ng build --configuration=production

  # ── Docker Build ──────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api-gateway
          push: false
          tags: travelsphere/api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          push: false
          tags: travelsphere/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Food Delivery Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/food-delivery-service
          push: false
          tags: travelsphere/food-delivery-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Update Badges ─────────────────────────────────────────────────────────
  update-badges:
    name: Update Status Badges
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update CI badge
        run: |
          # Update the CI status badge timestamp
          BADGE_CONTENT=$(curl -s "https://img.shields.io/badge/CI-Passing-brightgreen" 2>/dev/null || echo "https://img.shields.io/badge/CI-Passing-brightgreen")
          echo "CI Badge: $BADGE_CONTENT"
